<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HahaPu · 精选好物</title>
  <style>
    :root {
      --primary: #ff6b9d;
      --primary-light: #ffe4ef;
      --primary-dark: #e05585;
      --accent: #ffb347;
      --accent-light: #fff3e0;
      --text: #333;
      --text-muted: #888;
      --bg: #fafafa;
      --card-bg: #fff;
      --border: #f0f0f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-hover: 0 8px 24px rgba(255,107,157,0.2);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff9a5c 100%);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(255,107,157,0.3);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      text-decoration: none;
    }
    .logo-icon { font-size: 28px; }
    .logo-text { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .logo-sub { font-size: 12px; opacity: 0.85; }

    .search-bar {
      flex: 1;
      max-width: 400px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 44px 10px 16px;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,0.95);
      font-size: 14px;
      outline: none;
      color: var(--text);
    }
    .search-bar input::placeholder { color: #bbb; }
    .search-bar .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
    }

    .cart-btn {
      position: relative;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
      padding: 9px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .cart-btn:hover { background: rgba(255,255,255,0.3); }
    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ff3b30;
      color: white;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .cart-badge.show { display: flex; }

    /* ===== HERO BANNER ===== */
    .hero {
      background: linear-gradient(135deg, #fff5f8 0%, #fff3e8 100%);
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #ffe0ec;
    }
    .hero h2 {
      font-size: 22px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .hero-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .hero-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ===== NAV TABS ===== */
    .nav-tabs {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 65px;
      z-index: 90;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .nav-tabs-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
    }
    /* 主行（固定展示） */
    .nav-row-main {
      display: flex;
      width: 100%;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-row-main::-webkit-scrollbar { display: none; }
    /* 展开行（折叠/展开） */
    .nav-row-more {
      display: flex;
      width: 100%;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    .nav-row-more.expanded {
      max-height: 200px;
    }
    .tab-btn {
      padding: 12px 16px;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
    /* 展开/收起按钮 */
    .tab-btn-more {
      padding: 12px 14px;
      border: none;
      background: none;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
      transition: all 0.2s;
    }
    .tab-btn-more:hover { opacity: 0.75; }
    .tab-btn-more .arrow {
      display: inline-block;
      transition: transform 0.3s ease;
      font-style: normal;
    }
    .tab-btn-more.open .arrow { transform: rotate(180deg); }
    .tab-count {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 8px;
    }

    /* ===== MAIN CONTENT ===== */
    .main-wrapper {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
    }
    .main {
      flex: 1;
      padding: 20px;
      min-width: 0;
    }

    /* ===== SIDEBAR ===== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 199;
    }
    .sidebar-overlay.show { display: block; }
    .sidebar {
      display: none;
      width: 220px;
      background: white;
      border-right: 1px solid var(--border);
      height: calc(100vh - 65px);
      position: sticky;
      top: 65px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      font-weight: 700;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .sidebar-close {
      display: none;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .sidebar-cats {
      padding: 8px 0;
    }
    .sidebar-cat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .sidebar-cat:hover {
      background: var(--primary-light);
      color: var(--primary);
    }
    .sidebar-cat.active {
      background: var(--primary-light);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 700;
    }
    .sidebar-cat-icon {
      font-size: 18px;
    }
    .sidebar-cat-name {
      flex: 1;
    }
    .sidebar-cat-count {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 8px;
    }

    /* Desktop: show sidebar */
    @media (min-width: 1024px) {
      .sidebar {
        display: block;
      }
    }

    /* Mobile: sidebar as overlay */
    @media (max-width: 1023px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0;
        width: 280px;
        height: 100vh;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: block; }
      .sidebar-overlay.show { display: block; }
    }

    .section { display: none; }
    .section.active { display: block; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .section-icon { font-size: 22px; }
    .section-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .section-desc { font-size: 13px; color: var(--text-muted); margin-left: auto; }

    /* ===== BRAND FILTER ===== */
    .brand-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .brand-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-weight: 500;
    }
    .brand-chip:hover { border-color: var(--primary); color: var(--primary); }
    .brand-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
    .brand-filter-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand-rest {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-rest.expanded { display: flex; }
    .brand-chip.more-btn {
      border-style: dashed;
      color: var(--primary);
      font-weight: 600;
      margin-left: 2px;
    }
    .brand-chip.more-btn.open { border-style: solid; }

    /* ===== HOT PRODUCTS ===== */
    .hot-section {
      margin-bottom: 20px;
    }
    .hot-products-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-light) transparent;
    }
    .hot-products-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .hot-products-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .hot-products-scroll::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 3px;
    }
    .hot-products-scroll .product-card {
      min-width: 180px;
      max-width: 180px;
    }

    /* ===== PRODUCT GRID ===== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
      border: 1.5px solid transparent;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-light);
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      background: #f8f8f8;
    }
    .product-img-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.05); }
    .product-img-placeholder {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: linear-gradient(135deg, #fff5f8, #fff3e0);
    }

    .product-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .product-info {
      padding: 10px 12px 12px;
    }
    .product-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-brand {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .product-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }
    .product-price span { font-size: 12px; font-weight: 500; }
    .product-desc-preview {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      min-height: 16px;
    }

    .add-to-cart-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 9px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .add-to-cart-btn:hover { opacity: 0.9; transform: scale(0.98); }
    .add-to-cart-btn.added {
      background: linear-gradient(135deg, #4caf50, #388e3c);
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .qty-btn {
      width: 34px;
      height: 34px;
      background: var(--primary-light);
      border: none;
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--primary); color: white; }
    .qty-num {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      background: white;
    }

    /* ===== PRODUCT DETAIL MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #f8f8f8;
      padding: 16px;
    }
    .modal-body { padding: 20px; }
    .modal-category {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 10px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .modal-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .modal-price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }
    .modal-price {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }
    .modal-price span { font-size: 16px; }
    .modal-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    .modal-desc-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .modal-desc.empty {
      color: #ccc;
      font-style: italic;
    }
    .modal-cart-section {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: white;
      position: sticky;
      bottom: 0;
    }
    .modal-qty-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .modal-qty-label { font-size: 14px; color: var(--text); font-weight: 600; }
    .modal-qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .modal-qty-btn {
      width: 36px;
      height: 36px;
      background: var(--primary-light);
      border: none;
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-qty-btn:hover { background: var(--primary); color: white; }
    .modal-qty-num {
      width: 48px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      background: white;
    }
    .modal-add-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 14px 0;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-add-btn:hover { opacity: 0.9; }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.12);
      border: none;
      color: #555;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== CART DRAWER ===== */
    .cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
    }
    .cart-overlay.show { display: block; }
    .cart-drawer {
      position: fixed;
      right: -100%;
      top: 0;
      width: min(420px, 100vw);
      height: 100vh;
      background: white;
      z-index: 301;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }
    .cart-drawer.open { right: 0; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-title { font-size: 18px; font-weight: 700; }
    .cart-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f5f5f5;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .cart-empty-icon { font-size: 52px; margin-bottom: 12px; }
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .cart-item-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: #f5f5f5;
      flex-shrink: 0;
    }
    .cart-item-img-placeholder {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #fff5f8, #fff3e0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
      color: var(--text);
    }
    .cart-item-category { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .cart-item-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-item-price { font-size: 16px; font-weight: 700; color: var(--primary); }
    .cart-item-qty {
      display: flex;
      align-items: center;
      border: 1.5px solid #e0e0e0;

// ===================== NAV TABS =====================
// 主行固定展示的分类 key（按顺序）
const MAIN_CATS = ["all", "宝宝辅食", "宝宝护理", "宝宝零食", "保健类"];

let navExpanded = false;

function makeCatBtn(c) {
  const count = c.key === "all"
    ? PRODUCTS.length
    : c.key === "about"
    ? null
    : PRODUCTS.filter(p => p.category === c.key).length;
  return `<button class="tab-btn${currentCategory===c.key?' active':''}" onclick="switchCategory('${c.key}')">
    ${c.icon} ${c.label}
    ${count!==null?`<span class="tab-count">${count}</span>`:''}
  </button>`;
}

function renderNavTabs() {
  const mainRow = document.getElementById("navTabsMain");
  const moreRow = document.getElementById("navTabsMore");

  const mainCats = CATEGORIES.filter(c => MAIN_CATS.includes(c.key));
  // 排序按 MAIN_CATS 顺序
  mainCats.sort((a,b) => MAIN_CATS.indexOf(a.key) - MAIN_CATS.indexOf(b.key));
  const moreCats = CATEGORIES.filter(c => !MAIN_CATS.includes(c.key));

  mainRow.innerHTML = mainCats.map(makeCatBtn).join('') +
    `<button class="tab-btn-more${navExpanded?' open':''}" onclick="toggleNavMore()" id="btnMore">
      更多 <i class="arrow">▾</i>
    </button>`;

  moreRow.innerHTML = moreCats.map(makeCatBtn).join('');
  if (navExpanded) moreRow.classList.add('expanded');
  else moreRow.classList.remove('expanded');
}

function toggleNavMore() {
  navExpanded = !navExpanded;
  const moreRow = document.getElementById("navTabsMore");
  const btn = document.getElementById("btnMore");
  moreRow.classList.toggle('expanded', navExpanded);
  btn.classList.toggle('open', navExpanded);
  btn.innerHTML = navExpanded ? '收起 <i class="arrow">▾</i>' : '更多 <i class="arrow">▾</i>';
}

// ===================== SWITCH CATEGORY =====================
function switchCategory(key) {
  currentCategory = key;
  currentBrandFilter = "all";
  // 如果选中的是"更多"区域的分类，保持展开状态；否则不改变
  renderNavTabs();
  renderMain();
}

// ===================== SEARCH =====================
function handleSearch() {
  searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
  currentCategory = "all";
  renderNavTabs();
  renderMain();
}

// ===================== RENDER MAIN =====================
function renderMain() {
  const main = document.getElementById("mainContent");

  if (currentCategory === "about") {
    main.innerHTML = renderAbout();
    return;
  }

  let products = PRODUCTS;

  // search filter
  if (searchKeyword) {
    products = products.filter(p =>
      p.name.toLowerCase().includes(searchKeyword) ||
      p.brand.toLowerCase().includes(searchKeyword) ||
      p.category.toLowerCase().includes(searchKeyword)
    );
  } else if (currentCategory !== "all") {
    products = products.filter(p => p.category === currentCategory);
  }

  // brand filter
  const brands = [...new Set(products.map(p=>p.brand))].sort();

  if (currentBrandFilter !== "all") {
    products = products.filter(p => p.brand === currentBrandFilter);
  }

  const catInfo = CATEGORIES.find(c => c.key === currentCategory) || CATEGORIES[0];

  // 爆款推荐商品
  const hotProducts = PRODUCTS.filter(p => p.isHot);

  let html = `<div class="section active">`;

  // 如果是全部商品且没有搜索，显示爆款推荐
  if (currentCategory === "all" && !searchKeyword) {
    html += `
      <div class="hot-section">
        <div class="section-header">
          <span class="section-icon">🔥</span>
          <span class="section-title">爆款推荐</span>
          <span class="section-desc">最受欢迎的热销商品</span>
        </div>
        <div class="hot-products-scroll">
          ${hotProducts.map(p => renderProductCard(p)).join('')}
        </div>
      </div>
      <div style="margin: 24px 0; border-top: 1px solid var(--border);"></div>
    `;
  }

  html += `
    <div class="section-header">
      <span class="section-icon">${catInfo.icon}</span>
      <span class="section-title">${catInfo.label}</span>
      <span class="section-desc">共 ${products.length} 件商品</span>
    </div>
    ${brands.length > 1 ? renderBrandFilter(brands) : ''}
    ${products.length === 0
      ? `<div class="no-results">🔍 没有找到相关商品</div>`
      : `<div class="product-grid">${products.map(p => renderProductCard(p)).join('')}</div>`
    }
  `;

  html += `</div>`;
  main.innerHTML = html;
}

// ===================== BRAND FILTER =====================
const PRIORITY_BRANDS = ["丝塔芙","宝宝百味","renewallife","農純郷"];
let brandExpanded = false;

function renderBrandFilter(brands) {
  const priority = brands.filter(b => PRIORITY_BRANDS.includes(b));
  const rest     = brands.filter(b => !PRIORITY_BRANDS.includes(b));
  let html = `<div class="brand-filter-scroll">`;
  html += `<button class="brand-chip${currentBrandFilter==='all'?' active':''}" onclick="filterBrand('all')">全部</button>`;
  for (const b of priority) {
    html += `<button class="brand-chip${currentBrandFilter===b?' active':''}" onclick="filterBrand('${b.replace(/'/g,"\'")}')">${b}</button>`;
  }
  if (rest.length > 0) {
    html += `<button class="brand-chip more-btn${brandExpanded?' open':''}" onclick="toggleBrandExpand()">更多 ▾</button>`;
    html += `<span class="brand-rest${brandExpanded?' expanded':''}">`;
    for (const b of rest) {
      html += `<button class="brand-chip${currentBrandFilter===b?' active':''}" onclick="filterBrand('${b.replace(/'/g,"\'")}')">${b}</button>`;
    }
    html += `</span>`;
  }
  html += `</div>`;
  return html;
}

function toggleBrandExpand() {
  brandExpanded = !brandExpanded;
  renderMain();
}

function filterBrand(brand) {
  currentBrandFilter = brand;
  renderMain();
}

// ===================== PRODUCT CARD =====================
function renderProductCard(p) {
  const inCart = cart[p.id] && cart[p.id].qty > 0;
  const qty = inCart ? cart[p.id].qty : 0;

  return `<div class="product-card" onclick="openProduct(${p.id})">
    <div class="product-img-wrap">
      <img src="${encodeURI(p.image)}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy" />
      <div class="product-img-placeholder" style="display:none;">${getCategoryEmoji(p.category)}</div>
    </div>
    <div class="product-info">
      <div class="product-brand">${p.brand}</div>
      <div class="product-name">${p.name}</div>
      ${p.desc ? `<div class="product-desc-preview">${p.desc}</div>` : '<div class="product-desc-preview"></div>'}
      <div class="product-price-row">
        <div class="product-price"><span>¥</span>${p.price}</div>
      </div>
      ${qty > 0
        ? `<div class="qty-control" onclick="event.stopPropagation()">
            <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
            <div class="qty-num">${qty}</div>
            <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
          </div>`
        : `<button class="add-to-cart-btn" onclick="quickAdd(event,${p.id})">🛒 加入购物车</button>`
      }
    </div>
  </div>`;
}

function getCategoryEmoji(cat) {
  if (cat.includes("护理")) return "🌿";
  if (cat.includes("零食")) return "🍪";
  if (cat.includes("辅食")) return "🥣";
  if (cat.includes("夏日")) return "☀️";
  if (cat.includes("玩具")) return "🧸";
  if (cat.includes("用品")) return "🍼";
  if (cat.includes("保健")) return "💊";
  if (cat.includes("成人")) return "✨";
  return "🛍️";
}

// ===================== QUICK ADD =====================
function quickAdd(event, id) {
  event.stopPropagation();
  const p = PRODUCTS.find(x=>x.id===id);
  if (!cart[id]) cart[id] = { ...p, qty: 0 };
  cart[id].qty += 1;
  updateCartBadge();
  renderMain();
  showToast(`已加入购物车 🛒`);
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty = Math.max(0, cart[id].qty + delta);
  if (cart[id].qty === 0) delete cart[id];
  updateCartBadge();
  renderMain();
}

// ===================== PRODUCT MODAL =====================
function openProduct(id) {
  modalProduct = PRODUCTS.find(p=>p.id===id);
  modalQty = 1;
  document.getElementById("modalCategory").textContent = modalProduct.category;
  document.getElementById("modalName").textContent = modalProduct.name;
  document.getElementById("modalPrice").innerHTML = `<span>¥</span>${modalProduct.price}`;
  const desc = modalProduct.desc || "";
  const descEl = document.getElementById("modalDesc");
  if (desc) {
    descEl.textContent = desc;
    descEl.classList.remove("empty");
  } else {
    descEl.textContent = "产品介绍即将更新，如需了解详情请咨询客服～";
    descEl.classList.add("empty");
  }
  const img = document.getElementById("modalImg");
  const ph = document.getElementById("modalImgPlaceholder");
  img.src = encodeURI(modalProduct.image);
  img.style.display = "block";
  ph.style.display = "none";
  ph.textContent = getCategoryEmoji(modalProduct.category);
  document.getElementById("modalQtyNum").textContent = 1;
  document.getElementById("productModal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(e) {
  if (e.target === document.getElementById("productModal")) closeProductModal();
}

function closeProductModal() {
  document.getElementById("productModal").classList.remove("show");
  document.body.style.overflow = "";
}

function changeModalQty(delta) {
  modalQty = Math.max(1, modalQty + delta);
  document.getElementById("modalQtyNum").textContent = modalQty;
}

function addFromModal() {
  if (!modalProduct) return;
  const id = modalProduct.id;
  if (!cart[id]) cart[id] = { ...modalProduct, qty: 0 };
  cart[id].qty += modalQty;
  updateCartBadge();
  renderMain();
  closeProductModal();
  showToast(`已加入 ${modalQty} 件 🛒`);
}

// ===================== CART =====================
function openCart() {
  document.getElementById("cartOverlay").classList.add("show");
  document.getElementById("cartDrawer").classList.add("open");
  document.body.style.overflow = "hidden";
  renderCart();
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("show");
  document.getElementById("cartDrawer").classList.remove("open");
  document.body.style.overflow = "";
}

function renderCart() {
  const items = Object.values(cart);
  const itemsEl = document.getElementById("cartItems");
  const footerEl = document.getElementById("cartFooter");

  if (items.length === 0) {
    itemsEl.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">🛍️</div>
      <div>购物车空空的</div>
      <div style="font-size:13px;margin-top:6px;">快去挑选宝贝喜欢的商品吧~</div>
    </div>`;
    footerEl.style.display = "none";
    return;
  }

  itemsEl.innerHTML = items.map(item => `
    <div class="cart-item">
      <img class="cart-item-img" src="${encodeURI(item.image)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="cart-item-img-placeholder" style="display:none;">${getCategoryEmoji(item.category)}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-category">${item.category}</div>
        <div class="cart-item-price-row">
          <div class="cart-item-price">¥${item.price}</div>
          <div class="cart-item-qty">
            <button class="ci-qty-btn" onclick="cartChangeQty(${item.id},-1)">−</button>
            <div class="ci-qty-num">${item.qty}</div>
            <button class="ci-qty-btn" onclick="cartChangeQty(${item.id},1)">+</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  const total = items.reduce((s,i)=>s+i.price*i.qty, 0);
  const totalQty = items.reduce((s,i)=>s+i.qty, 0);
  document.getElementById("cartTotal").textContent = `¥${total}`;
  document.getElementById("cartItemCount").textContent = `共 ${items.length} 种商品，合计 ${totalQty} 件`;
  footerEl.style.display = "block";
}

function cartChangeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty = Math.max(0, cart[id].qty + delta);
  if (cart[id].qty === 0) delete cart[id];
  updateCartBadge();
  renderCart();
  renderMain();
}

function clearCart() {
  if (!confirm("确定要清空购物车吗？")) return;
  cart = {};
  updateCartBadge();
  renderCart();
  renderMain();
}

function updateCartBadge() {
  const total = Object.values(cart).reduce((s,i)=>s+i.qty, 0);
  const badge = document.getElementById("cartBadge");
  badge.textContent = total;
  badge.classList.toggle("show", total > 0);
}

// ===================== CHECKOUT =====================
function openCheckout() {
  const items = Object.values(cart);
  if (items.length === 0) return;

  const listEl = document.getElementById("checkoutOrderList");
  listEl.innerHTML = items.map(item => `
    <div class="checkout-order-item">
      <span class="co-name">${item.name}</span>
      <span class="co-qty">×${item.qty}</span>
      <span class="co-price">¥${item.price * item.qty}</span>
    </div>
  `).join('');

  const total = items.reduce((s,i)=>s+i.price*i.qty, 0);
  document.getElementById("checkoutTotal").textContent = `¥${total}`;

  closeCart();
  document.getElementById("checkoutOverlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeCheckout() {
  document.getElementById("checkoutOverlay").classList.remove("show");
  document.body.style.overflow = "";
}

  const note = document.getElementById("buyerNote").value.trim();

  if (!name) { showToast("请填写收件人姓名"); return; }
  if (!phone || !/^1[3-9]\d{9}$/.test(phone)) { showToast("请填写正确的手机号码"); return; }
  if (!address) { showToast("请填写收货地址"); return; }

  const items = Object.values(cart);
  const total = items.reduce((s,i)=>s+i.price*i.qty, 0);
  const orderNo = "DD" + Date.now();
  const orderTime = new Date().toLocaleString("zh-CN");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "提交中...";

  // 构建订单数据
  const orderData = {
    orderNo, orderTime, name, phone, address, note,
    items: items.map(i=>({ name:i.name, brand:i.brand, category:i.category, price:i.price, qty:i.qty, subtotal:i.price*i.qty })),
    total,
  };

  // 推送到 Supabase 云数据库（直接 fetch，无需 SDK）
  let cloudOk = false;
  try {
    const itemsJson = JSON.stringify(orderData.items);
    const resp = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/orders", {
      method: "POST",
      headers: {
        "apikey": CONFIG.SUPABASE_KEY,
        "Authorization": "Bearer " + CONFIG.SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify([{
        order_no: orderNo,
        customer_name: name,
        phone: phone,
        address: address,
        items: itemsJson,
        total_amount: total,
        remark: note,
        status: "待处理"
      }])
    });
    if (resp.ok) { cloudOk = true; }
    else { console.warn("Supabase 提交失败:", await resp.text()); }
  } catch(e) { console.warn("Supabase 提交异常:", e); }

  // 无论云端是否成功，都本地存储订单（兜底）
  saveOrderLocally(orderData);

  btn.disabled = false;
  btn.textContent = "提交订单 🎉";

  closeCheckout();
  cart = {};
  updateCartBadge();
  renderMain();

  // 根据云端是否成功显示不同提示
  if (cloudOk) {
    showToast("✅ 订单已提交成功！");
  } else {
    showToast("⚠️ 订单已记录，网络同步中...");
  }

  document.getElementById("successOverlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

// ===================== 本地存储订单 =====================
function saveOrderLocally(orderData) {
  try {
    const orders = JSON.parse(localStorage.getItem("shop_orders") || "[]");
    orders.unshift(orderData);
    localStorage.setItem("shop_orders", JSON.stringify(orders.slice(0, 200)));
  } catch(e) {}
}

function closeSuccess() {
  document.getElementById("successOverlay").classList.remove("show");
  document.body.style.overflow = "";
  document.getElementById("buyerName").value = "";
  document.getElementById("buyerPhone").value = "";
  document.getElementById("buyerAddress").value = "";
  document.getElementById("buyerNote").value = "";
}
