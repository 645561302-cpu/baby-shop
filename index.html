<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HahaPu 宝贝优选代购商城</title>
<style>
/* ===== VARIABLES ===== */
:root {
  --primary: #ff6b8a;
  --primary-dark: #ff4d7a;
  --primary-light: #fff0f4;
  --bg: #f5f5f5;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-muted: #888888;
  --border: #f0f0f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 14px;
  --tab-bar-h: 56px;
  --header-h: 52px;
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ===== APP SHELL ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
.app-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  padding: 10px 14px;
  flex-shrink: 0;
  z-index: 100;
}
.app-header-inner {
  display: flex;
  align-items: center;
  gap: 10px;
}
.app-logo {
  font-size: 18px;
  font-weight: 800;
  color: white;
  letter-spacing: 1px;
  white-space: nowrap;
}
.app-search {
  flex: 1;
  position: relative;
}
.app-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: none;
  border-radius: 18px;
  font-size: 13px;
  background: rgba(255,255,255,0.95);
  color: var(--text);
  outline: none;
}
.app-search input::placeholder { color: #bbb; }
.app-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: #bbb;
}

/* ===== MAIN CONTENT ===== */
.app-main {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.tab-page {
  display: none;
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-page.active { display: block; }

/* ===== TAB BAR ===== */
.tab-bar {
  display: flex;
  height: var(--tab-bar-h);
  background: white;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 11px;
  border: none;
  background: none;
  transition: all 0.2s;
  position: relative;
}
.tab-item.active { color: var(--primary); }
.tab-item .tab-icon { font-size: 22px; line-height: 1; }
.tab-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 18px);
  background: #ff3b30;
  color: white;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}
.tab-badge.show { display: flex; }

/* ===== HOME TAB ===== */
.home-content { padding: 12px; padding-bottom: 80px; }
.hot-section { margin-bottom: 16px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.section-icon { font-size: 18px; }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); }
.section-desc { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.hot-products-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: thin;
}
.hot-products-scroll::-webkit-scrollbar { height: 4px; }
.hot-products-scroll::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 2px; }
.hot-products-scroll .product-card { min-width: 150px; max-width: 150px; }

.brand-filter-scroll {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 14px;
}
.brand-chip {
  padding: 5px 12px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
  font-weight: 500;
  white-space: nowrap;
}
.brand-chip:hover { border-color: var(--primary); color: var(--primary); }
.brand-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
.brand-chip.more-btn {
  border-style: dashed;
  color: var(--primary);
  font-weight: 600;
}
.brand-chip.more-btn.open { border-style: solid; }

/* ===== PRODUCT GRID ===== */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.product-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all 0.25s;
  cursor: pointer;
  position: relative;
  border: 1.5px solid transparent;
}
.product-card:active { transform: scale(0.98); }
.product-img-wrap {
  position: relative;
  width: 100%;
  padding-top: 100%;
  overflow: hidden;
  background: #f8f8f8;
}
.product-img-wrap img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}
.product-img-placeholder {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  background: linear-gradient(135deg, #fff5f8, #fff3e0);
}
.product-tag {
  position: absolute;
  top: 6px;
  left: 6px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 8px;
}
.product-info { padding: 8px 10px 10px; }
.product-name {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 3px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}
.product-brand { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
.product-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.product-price {
  font-size: 16px;
  font-weight: 800;
  color: var(--primary);
}
.product-price span { font-size: 11px; font-weight: 500; }
.add-to-cart-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* ===== CATEGORY TAB (Left sidebar + Right content) ===== */
.category-page {
  display: flex;
  height: 100%;
  overflow: hidden;
}
.cat-sidebar {
  width: 90px;
  background: #fafafa;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
.cat-sidebar-item {
  padding: 14px 8px;
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  line-height: 1.3;
}
.cat-sidebar-item.active {
  background: white;
  color: var(--primary);
  border-left-color: var(--primary);
  font-weight: 700;
}
.cat-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  -webkit-overflow-scrolling: touch;
}
.cat-brand-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.cat-brand-row::-webkit-scrollbar { display: none; }
.cat-brand-row .brand-chip { flex-shrink: 0; }

/* ===== CART TAB ===== */
.cart-page { padding: 12px; padding-bottom: 80px; }
.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.cart-empty-icon { font-size: 56px; margin-bottom: 16px; }
.cart-item {
  display: flex;
  gap: 10px;
  background: white;
  padding: 12px;
  border-radius: var(--radius);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.cart-item-img {
  width: 70px; height: 70px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.cart-item-price { font-size: 14px; font-weight: 700; color: var(--primary); }
.cart-item-qty {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.cart-item-qty button {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cart-item-remove {
  background: none;
  border: none;
  color: #ff3b30;
  cursor: pointer;
  font-size: 12px;
  margin-top: 4px;
}
.cart-footer {
  position: fixed;
  bottom: var(--tab-bar-h);
  left: 0; right: 0;
  background: white;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
}
.cart-total-val { font-size: 20px; font-weight: 800; color: var(--primary); }
.cart-checkout-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

/* ===== PROFILE TAB ===== */
.profile-page { padding: 12px; padding-bottom: 80px; }
.profile-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.profile-card h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}
.address-item {
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  position: relative;
}
.address-item.active { border-color: var(--primary); background: var(--primary-light); }
.address-item .addr-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.address-item .addr-detail { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.address-item .addr-phone { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.address-item .addr-default-tag {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--primary);
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 6px;
}
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}
.btn-secondary {
  width: 100%;
  background: var(--bg);
  color: var(--text-muted);
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.form-group label span { color: #ff3b30; }
.form-group input, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }

/* ===== MODALS ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  justify-content: center;
  align-items: flex-end;
  padding: 0;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 20px 20px 0 0;
  max-width: 100%;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
  position: relative;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  background: rgba(0,0,0,0.05);
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-muted);
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-img-wrap {
  width: 100%;
  padding-top: 80%;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 14px;
  background: #f8f8f8;
}
.modal-img-wrap img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.modal-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.modal-brand { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.modal-price { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
.modal-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 16px; }
.modal-qty-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}
.qty-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: white;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-display { font-size: 18px; font-weight: 700; min-width: 30px; text-align: center; }
.modal-add-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

/* Checkout modal */
.checkout-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  justify-content: center;
  align-items: flex-end;
  padding: 0;
}
.checkout-overlay.show { display: flex; }
.checkout-modal {
  background: white;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
}
.checkout-modal-header { margin-bottom: 14px; }
.checkout-modal-header h3 { font-size: 17px; font-weight: 700; }
.checkout-modal-header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.checkout-order-list { margin-bottom: 14px; }
.checkout-order-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.checkout-total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.checkout-total-val { font-size: 20px; font-weight: 800; color: var(--primary); }
.form-note {
  background: var(--primary-light);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--primary);
  margin-bottom: 14px;
  line-height: 1.5;
}
.checkout-actions {
  display: flex;
  gap: 10px;
}
.checkout-actions button { flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
.co-cancel-btn { background: var(--bg); color: var(--text-muted); }
.co-submit-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }

/* Success modal */
.success-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.success-overlay.show { display: flex; }
.success-modal {
  background: white;
  border-radius: 20px;
  max-width: 360px;
  width: 100%;
  padding: 36px 20px;
  text-align: center;
}
.success-icon { font-size: 56px; margin-bottom: 14px; }
.success-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.success-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.6; }
.success-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

/* Address modal */
.address-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  justify-content: center;
  align-items: flex-end;
  padding: 0;
}
.address-overlay.show { display: flex; }
.address-modal {
  background: white;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
}
</style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-logo">🛍️ HahaPu</div>
      <div class="app-search">
        <span class="app-search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索商品、品牌..." oninput="handleSearch()" />
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main">
    <!-- TAB: HOME -->
    <div class="tab-page active" id="tab-home">
      <div class="home-content" id="homeContent"></div>
    </div>

    <!-- TAB: CATEGORY -->
    <div class="tab-page" id="tab-category">
      <div class="category-page">
        <div class="cat-sidebar" id="catSidebar"></div>
        <div class="cat-content" id="catContent"></div>
      </div>
    </div>

    <!-- TAB: CART -->
    <div class="tab-page" id="tab-cart">
      <div class="cart-page" id="cartPage"></div>
    </div>

    <!-- TAB: PROFILE -->
    <div class="tab-page" id="tab-profile">
      <div class="profile-page" id="profilePage"></div>
    </div>
  </main>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('home')" data-tab="home">
      <span class="tab-icon">🏠</span>
      <span>官方精选</span>
    </button>
    <button class="tab-item" onclick="switchTab('category')" data-tab="category">
      <span class="tab-icon">📂</span>
      <span>分类</span>
    </button>
    <button class="tab-item" onclick="switchTab('cart')" data-tab="cart">
      <span class="tab-icon">🛒</span>
      <span>购物车</span>
      <span class="tab-badge" id="tabCartBadge">0</span>
    </button>
    <button class="tab-item" onclick="switchTab('profile')" data-tab="profile">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="productModal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- CHECKOUT MODAL -->
<div class="checkout-overlay" id="checkoutOverlay">
  <div class="checkout-modal">
    <div class="checkout-modal-header">
      <h3>📋 确认订单</h3>
      <p>请填写收件信息，我们会及时联系您</p>
    </div>
    <div class="checkout-order-list" id="checkoutOrderList"></div>
    <div class="checkout-total-row">
      <span>订单合计</span>
      <span class="checkout-total-val" id="checkoutTotal">¥0</span>
    </div>
    <div class="form-note">
      💡 填写完成后点击「提交订单」，我们会收到您的订单并尽快安排代购，无需在线支付。
    </div>
    <div id="checkoutAddressSection"></div>
    <div class="checkout-form" id="checkoutForm"></div>
    <div class="checkout-actions">
      <button class="co-cancel-btn" onclick="closeCheckout()">取消</button>
      <button class="co-submit-btn" onclick="submitOrder()">提交订单 🎉</button>
    </div>
  </div>
</div>

<!-- ADDRESS MODAL -->
<div class="address-overlay" id="addressOverlay">
  <div class="address-modal">

// ===================== INIT =====================

// ===================== LOCAL STORAGE =====================
function loadCart() {
  try { cart = JSON.parse(localStorage.getItem("hahapu_cart") || "{}"); } catch(e) { cart = {}; }
}
function saveCart() {
  localStorage.setItem("hahapu_cart", JSON.stringify(cart));
}
function loadAddresses() {
  try {
    addresses = JSON.parse(localStorage.getItem("hahapu_addresses") || "[]");
    defaultAddressId = localStorage.getItem("hahapu_default_address_id");
  } catch(e) { addresses = []; defaultAddressId = null; }
}
function saveAddresses() {
  localStorage.setItem("hahapu_addresses", JSON.stringify(addresses));
  localStorage.setItem("hahapu_default_address_id", defaultAddressId || "");
}

// ===================== TAB SWITCHING =====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-page").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  document.querySelectorAll(".tab-item").forEach(el => el.classList.remove("active"));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add("active");

  if (tab === "home") renderHome();
  if (tab === "category") renderCategoryContent();
  if (tab === "cart") renderCartPage();
  if (tab === "profile") renderProfile();
}

// ===================== SEARCH =====================
function handleSearch() {
  searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
  if (searchKeyword) {
    switchTab("home");
  }
  renderHome();
}

// ===================== HOME RENDER =====================
function renderHome() {
  const container = document.getElementById("homeContent");
  let products = PRODUCTS;

  if (searchKeyword) {
    products = products.filter(p =>
      p.name.toLowerCase().includes(searchKeyword) ||
      p.brand.toLowerCase().includes(searchKeyword) ||
      p.category.toLowerCase().includes(searchKeyword)
    );
  }

  const hotProducts = PRODUCTS.filter(p => p.isHot);
  const brands = [...new Set(products.map(p=>p.brand).filter(b=>b))].sort();

  let html = "";

  if (!searchKeyword) {
    html += `
      <div class="hot-section">
        <div class="section-header">
          <span class="section-icon">🔥</span>
          <span class="section-title">爆款推荐</span>
          <span class="section-desc">最受欢迎的热销商品</span>
        </div>
        <div class="hot-products-scroll">
          ${hotProducts.map(p => renderProductCard(p)).join("")}
        </div>
      </div>
    `;
  }

  html += `
    <div class="section-header">
      <span class="section-icon">🏪</span>
      <span class="section-title">${searchKeyword ? "搜索结果" : "全部商品"}</span>
      <span class="section-desc">共 ${products.length} 件</span>
    </div>
  `;

  if (brands.length > 1 && !searchKeyword) {
    html += renderBrandFilter(brands);
  }

  html += products.length === 0
    ? `<div style="text-align:center;padding:40px;color:var(--text-muted);">🔍 没有找到相关商品</div>`
    : `<div class="product-grid">${products.map(p => renderProductCard(p)).join("")}</div>`;

  container.innerHTML = html;
}

// ===================== CATEGORY RENDER =====================
function renderCategorySidebar() {
  const sidebar = document.getElementById("catSidebar");
  sidebar.innerHTML = CATEGORIES.filter(c => c.key !== "all").map(c => {
    const count = PRODUCTS.filter(p => p.category === c.key).length;
    return `<div class="cat-sidebar-item${currentCategory===c.key?' active':''}" onclick="switchCategory('${c.key}')">
      ${c.label}<br><span style="font-size:10px;opacity:0.7;">${count}件</span>
    </div>`;
  }).join("");
}

  const content = document.getElementById("catContent");
  const catInfo = CATEGORIES.find(c => c.key === currentCategory) || CATEGORIES[1];
  let products = PRODUCTS.filter(p => p.category === currentCategory);

  if (currentBrandFilter !== "all") {
    products = products.filter(p => p.brand === currentBrandFilter);
  }

  const brands = [...new Set(PRODUCTS.filter(p=>p.category===currentCategory).map(p=>p.brand).filter(b=>b))].sort();

  let html = `
    <div class="section-header">
      <span class="section-icon">${catInfo.icon}</span>
      <span class="section-title">${catInfo.label}</span>
      <span class="section-desc">共 ${products.length} 件</span>
    </div>
  `;

  if (brands.length > 1) {
    html += `<div class="cat-brand-row">`;
    html += `<button class="brand-chip${currentBrandFilter==='all'?' active':''}" onclick="switchBrand('all')">全部</button>`;
    // 分类页面品牌全部显示，不折叠（每个分类品牌数量不多）
    brands.forEach(b => {
      html += `<button class="brand-chip${currentBrandFilter===b?' active':''}" onclick="switchBrand('${b}')">${b}</button>`;
    });
    html += `</div>`;
  }

  html += products.length === 0
    ? `<div style="text-align:center;padding:40px;color:var(--text-muted);">该分类暂无商品</div>`
    : `<div class="product-grid">${products.map(p => renderProductCard(p)).join("")}</div>`;

  content.innerHTML = html;
}

function switchCategory(key) {
  currentCategory = key;
  currentBrandFilter = "all";
  brandExpanded = false;
  renderCategorySidebar();
  renderCategoryContent();
}

function switchBrand(brand) {
  currentBrandFilter = brand;
  if (currentTab === "home") renderHome();
  if (currentTab === "category") renderCategoryContent();
}

function toggleBrandExpand() {
  brandExpanded = !brandExpanded;
  if (currentTab === "home") renderHome();
  if (currentTab === "category") renderCategoryContent();
}

function renderBrandFilter(brands) {
  const mainBrands = brands.filter(b => PRIORITY_BRANDS.includes(b));
  const restBrands = brands.filter(b => !PRIORITY_BRANDS.includes(b));
  let html = `<div class="brand-filter-scroll">`;
  html += `<button class="brand-chip${currentBrandFilter==='all'?' active':''}" onclick="switchBrand('all')">全部</button>`;
  mainBrands.forEach(b => {
    html += `<button class="brand-chip${currentBrandFilter===b?' active':''}" onclick="switchBrand('${b}')">${b}</button>`;
  });
  if (restBrands.length > 0) {
    html += `<button class="brand-chip more-btn${brandExpanded?' open':''}" onclick="toggleBrandExpand()">更多 ▾</button>`;
  }
  html += `</div>`;
  if (brandExpanded && restBrands.length > 0) {
    html += `<div class="brand-filter-scroll">`;
    restBrands.forEach(b => {
      html += `<button class="brand-chip${currentBrandFilter===b?' active':''}" onclick="switchBrand('${b}')">${b}</button>`;
    });
    html += `</div>`;
  }
  return html;
}

// ===================== PRODUCT CARD =====================
function renderProductCard(p) {
  return `
    <div class="product-card" onclick="openProductModal(${p.id})">
      <div class="product-img-wrap">
        <img src="${encodeURI(p.image)}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="product-img-placeholder" style="display:none;">🛍️</div>
        ${p.isHot ? '<div class="product-tag">🔥爆款</div>' : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-brand">${p.brand}</div>
        <div class="product-price-row">
          <div class="product-price">¥${p.price}<span>/件</span></div>
          <button class="add-to-cart-btn" onclick="event.stopPropagation();addToCart(${p.id},1)">+</button>
        </div>
      </div>
    </div>
  `;
}

// ===================== PRODUCT MODAL =====================
function openProductModal(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  modalProduct = p;
  modalQty = 1;
  const modal = document.getElementById("productModal");
  const content = document.getElementById("modalContent");
  content.innerHTML = `
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="modal-img-wrap">
      <img src="${encodeURI(p.image)}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="product-img-placeholder" style="display:none;">🛍️</div>
    </div>
    <div class="modal-name">${p.name}</div>
    <div class="modal-brand">${p.brand}</div>
    <div class="modal-price">¥${p.price}</div>
    ${p.desc ? `<div class="modal-desc">${p.desc}</div>` : ''}
    <div class="modal-qty-row">
      <button class="qty-btn" onclick="updateModalQty(-1)">−</button>
      <span class="qty-display" id="modalQty">1</span>
      <button class="qty-btn" onclick="updateModalQty(1)">+</button>
    </div>
    <button class="modal-add-btn" onclick="addToCartFromModal()">🛒 加入购物车</button>
  `;
  modal.classList.add("show");
}
function closeProductModal() { document.getElementById("productModal").classList.remove("show"); }
function updateModalQty(delta) { modalQty = Math.max(1, modalQty + delta); document.getElementById("modalQty").textContent = modalQty; }
function addToCartFromModal() { if (!modalProduct) return; addToCart(modalProduct.id, modalQty); closeProductModal(); }

// ===================== CART =====================
function addToCart(id, qty) {
  if (cart[id]) cart[id] += qty; else cart[id] = qty;
  saveCart();
  updateCartBadge();
  if (currentTab === "cart") renderCartPage();
}
function removeFromCart(id) {
  delete cart[id]; saveCart(); updateCartBadge();
  if (currentTab === "cart") renderCartPage();
}
function updateCartQty(id, delta) {
  if (!cart[id]) return;
  cart[id] = Math.max(0, cart[id] + delta);
  if (cart[id] === 0) delete cart[id];
  saveCart(); updateCartBadge();
  if (currentTab === "cart") renderCartPage();
}
function updateCartBadge() {
  const total = Object.values(cart).reduce((a,b) => a+b, 0);
  const badge = document.getElementById("tabCartBadge");
  badge.textContent = total;
  badge.classList.toggle("show", total > 0);
}

function renderCartPage() {
  const page = document.getElementById("cartPage");
  const items = Object.entries(cart);
  if (items.length === 0) {
    page.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">🛒</div>
      <div>购物车是空的</div>
      <button class="btn-primary" style="margin-top:20px;max-width:200px;" onclick="switchTab('home')">去逛逛</button>
    </div>`;
    const oldFooter = document.getElementById("cartFooter");
    if (oldFooter) oldFooter.style.display = "none";
    return;
  }

  let html = "";
  let total = 0;
  items.forEach(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    if (!p) return;
    total += p.price * qty;
    html += `
      <div class="cart-item">
        <img class="cart-item-img" src="${encodeURI(p.image)}" alt="${p.name}" onerror="this.style.display='none'" />
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-price">¥${p.price}</div>
          <div class="cart-item-qty">
            <button onclick="updateCartQty(${id},-1)">−</button>
            <span>${qty}</span>
            <button onclick="updateCartQty(${id},1)">+</button>
          </div>
          <button class="cart-item-remove" onclick="removeFromCart(${id})">删除</button>
        </div>
      </div>
    `;
  });

  page.innerHTML = html;

  let footer = document.getElementById("cartFooter");
  if (!footer) {
    footer = document.createElement("div");
    footer.id = "cartFooter";
    footer.className = "cart-footer";
    document.getElementById("tab-cart").appendChild(footer);
  }
  footer.innerHTML = `
    <div>
      <span style="font-size:13px;color:var(--text-muted);">合计 </span>
      <span class="cart-total-val">¥${total}</span>
    </div>
    <button class="cart-checkout-btn" onclick="openCheckout()">去结算</button>
  `;
  footer.style.display = "flex";
}

// ===================== CHECKOUT =====================
function openCheckout() {
  const items = Object.entries(cart);
  if (items.length === 0) return;

  let total = 0;
  let orderHtml = "";
  items.forEach(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    if (!p) return;
    total += p.price * qty;
    orderHtml += `<div class="checkout-order-item"><span>${p.name} x${qty}</span><span>¥${p.price*qty}</span></div>`;
  });

  document.getElementById("checkoutOrderList").innerHTML = orderHtml;
  document.getElementById("checkoutTotal").textContent = `¥${total}`;

  const addrSection = document.getElementById("checkoutAddressSection");
  const defaultAddr = addresses.find(a => a.id === defaultAddressId);
  if (defaultAddr) {
    addrSection.innerHTML = `
      <div class="profile-card" style="margin-bottom:14px;">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;">📍 收货地址</div>
        <div class="address-item active" style="margin-bottom:0;">
          <div class="addr-name">${defaultAddr.name} <span class="addr-default-tag">默认</span></div>
          <div class="addr-phone">${defaultAddr.phone}</div>
          <div class="addr-detail">${defaultAddr.detail}</div>
        </div>
      </div>
    `;
    document.getElementById("checkoutForm").innerHTML = `
      <div class="form-group">
        <label>备注（选填）</label>
        <input type="text" id="buyerNote" placeholder="如有特殊要求可在此说明" />
      </div>
    `;
  } else {
    addrSection.innerHTML = "";
    document.getElementById("checkoutForm").innerHTML = `
      <div class="form-group">
        <label>收件人姓名 <span>*</span></label>
        <input type="text" id="buyerName" placeholder="请输入真实姓名" />
      </div>
      <div class="form-group">
        <label>联系电话 <span>*</span></label>
        <input type="tel" id="buyerPhone" placeholder="请输入手机号码" />
      </div>
      <div class="form-group">
        <label>收货地址 <span>*</span></label>
        <textarea id="buyerAddress" placeholder="省/市/区 + 详细地址" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>备注（选填）</label>
        <input type="text" id="buyerNote" placeholder="如有特殊要求可在此说明" />
      </div>
    `;
  }

  document.getElementById("checkoutOverlay").classList.add("show");
}

function closeCheckout() { document.getElementById("checkoutOverlay").classList.remove("show"); }

function submitOrder() {
  const defaultAddr = addresses.find(a => a.id === defaultAddressId);
  let name, phone, address;

  if (defaultAddr) {
    name = defaultAddr.name;
    phone = defaultAddr.phone;
    address = defaultAddr.detail;
  } else {
    name = document.getElementById("buyerName").value.trim();
    phone = document.getElementById("buyerPhone").value.trim();
    address = document.getElementById("buyerAddress").value.trim();
  }
  const note = document.getElementById("buyerNote")?.value.trim() || "";

  if (!name || !phone || !address) {
    alert("请填写完整的收件信息！");
    return;
  }

  const items = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return { id, name: p?.name || "", price: p?.price || 0, qty };
  });
  const order = { name, phone, address, note, items, time: new Date().toISOString() };

  let orders = [];
  try { orders = JSON.parse(localStorage.getItem("shop_orders") || "[]"); } catch(e) {}
  orders.push(order);
  localStorage.setItem("shop_orders", JSON.stringify(orders));

  closeCheckout();
  document.getElementById("successOverlay").classList.add("show");
  cart = {};
  saveCart();
  updateCartBadge();
  renderCartPage();
}

function closeSuccess() { document.getElementById("successOverlay").classList.remove("show"); }

// ===================== PROFILE / ADDRESS =====================
function renderProfile() {
  const page = document.getElementById("profilePage");
  let html = "";

  html += `
    <div class="profile-card">
      <h3>📍 收货地址</h3>
      ${addresses.length === 0 ? '<p style="font-size:13px;color:var(--text-muted);">暂无保存的地址，请添加</p>' : ''}
  `;
  addresses.forEach(addr => {
    html += `
      <div class="address-item${addr.id===defaultAddressId?' active':''}" onclick="selectDefaultAddress('${addr.id}')">
        <div class="addr-name">${addr.name} ${addr.id===defaultAddressId?'<span class="addr-default-tag">默认</span>':''}</div>
        <div class="addr-phone">${addr.phone}</div>
        <div class="addr-detail">${addr.detail}</div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button onclick="event.stopPropagation();editAddress('${addr.id}')" style="font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:white;cursor:pointer;">编辑</button>
          <button onclick="event.stopPropagation();deleteAddress('${addr.id}')" style="font-size:12px;padding:4px 10px;border:1px solid #ff3b30;border-radius:6px;background:white;color:#ff3b30;cursor:pointer;">删除</button>
        </div>
      </div>
    `;
  });
  html += `<button class="btn-primary" onclick="openAddressModal()">+ 添加新地址</button></div>`;

  html += `
    <div class="profile-card">
      <h3>💬 关于我们</h3>
      <p style="font-size:13px;line-height:1.8;color:var(--text);">
        HahaPu 宝贝优选专注于为全球家庭提供优质、安全的母婴用品代购服务。<br>
        所有商品均从品牌官方渠道采购，确保正品品质。
      </p>
      <p style="font-size:13px;margin-top:10px;color:var(--text-muted);">
        📱 微信客服：HahaPu客服<br>
        📧 邮箱：service@hahapu.com
      </p>
    </div>
  `;

  page.innerHTML = html;
}

function selectDefaultAddress(id) {
  defaultAddressId = id;
  saveAddresses();
  renderProfile();
}

function openAddressModal(addrId) {
  editingAddressId = addrId || null;
  if (addrId) {
    const addr = addresses.find(a => a.id === addrId);
    if (addr) {
      document.getElementById("addrName").value = addr.name;
      document.getElementById("addrPhone").value = addr.phone;
      document.getElementById("addrDetail").value = addr.detail;
    }
  } else {
    document.getElementById("addrName").value = "";
    document.getElementById("addrPhone").value = "";
    document.getElementById("addrDetail").value = "";
  }
  document.getElementById("addressOverlay").classList.add("show");
}

function closeAddressModal() { document.getElementById("addressOverlay").classList.remove("show"); }

function saveAddress() {
  const name = document.getElementById("addrName").value.trim();
  const phone = document.getElementById("addrPhone").value.trim();
  const detail = document.getElementById("addrDetail").value.trim();
  if (!name || !phone || !detail) {
    alert("请填写完整信息！");
    return;
  }
  if (editingAddressId) {
    const idx = addresses.findIndex(a => a.id === editingAddressId);
    if (idx >= 0) addresses[idx] = { id: editingAddressId, name, phone, detail };
  } else {
    const id = "addr_" + Date.now();
    addresses.push({ id, name, phone, detail });
    if (!defaultAddressId) defaultAddressId = id;
  }
  saveAddresses();
  closeAddressModal();
  renderProfile();
}

function editAddress(id) { openAddressModal(id); }
function deleteAddress(id) {
  if (!confirm("确定删除此地址？")) return;
  addresses = addresses.filter(a => a.id !== id);
  if (defaultAddressId === id) defaultAddressId = addresses[0]?.id || null;
  saveAddresses();
  renderProfile();
}

// ===================== INIT =====================
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
